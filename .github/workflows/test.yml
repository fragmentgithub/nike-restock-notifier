name: Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run tests
        run: npm test

      - name: Install Cloudflare build tools
        run: npm ci

      - name: Validate Cloudflare deployment
        run: npm run cloudflare:build

      - name: Validate the private viewer bundle
        run: npm run viewer:build

      - name: Verify private viewer authentication, read-only RPC and SQLite state in the Cloudflare runtime
        run: npm run cloudflare:test
